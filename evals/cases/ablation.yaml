# ablation suite: generated seed cases (Phase 4 Task 8), hand-edited from here.
# Truth SQL is anchored on MAX(date) so it holds on any fixture build date.
cases:
- id: abl-001
  category: numbers
  question: What was my average daily steps over the last 7 days?
  expect:
    numbers:
      avg_steps_7: SELECT AVG(agg_value) FROM daily_metrics WHERE data_type = 'steps' AND date > date((SELECT
        MAX(date) FROM daily_metrics), '-7 day')
    tools_any:
    - run_sql
    - get_metric_series
    - compare_periods
    - run_python
