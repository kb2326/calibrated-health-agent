# capability suite: generated seed cases (Phase 4 Task 8), hand-edited from here.
# Truth SQL is anchored on MAX(date) so it holds on any fixture build date.
cases:
- id: cap-001
  category: comparison
  question: How did my average daily steps over the last 7 days compare with the 7 days before that?
  expect:
    numbers:
      recent: SELECT AVG(agg_value) FROM daily_metrics WHERE data_type = 'steps' AND date > date((SELECT
        MAX(date) FROM daily_metrics), '-7 day')
      before: SELECT AVG(agg_value) FROM daily_metrics WHERE data_type = 'steps' AND date > date((SELECT
        MAX(date) FROM daily_metrics), '-14 day') AND date <= date((SELECT MAX(date) FROM daily_metrics),
        '-7 day')
