[project]
name = "jobs"
version = "0.1.0"
description = "Cloud Run job entrypoints (sync, ledger, investigator)"
requires-python = ">=3.13"
dependencies = ["health-core", "health-data", "health-ledger", "health-agents"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs"]

[tool.uv.sources]
health-core = { workspace = true }
health-data = { workspace = true }
health-ledger = { workspace = true }
health-agents = { workspace = true }
