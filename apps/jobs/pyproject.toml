[project]
name = "jobs"
version = "0.1.0"
description = "Cloud Run job entrypoints (no ADK)"
requires-python = ">=3.13"
dependencies = ["health-core", "health-data"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs"]

[tool.uv.sources]
health-core = { workspace = true }
health-data = { workspace = true }
