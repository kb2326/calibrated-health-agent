[project]
name = "health-agents"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["health-core", "health-data", "health-ledger", "google-adk==2.12.0", "typer>=0.12"]

[project.scripts]
cha = "health_agents.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_agents"]

[tool.uv.sources]
health-core = { workspace = true }
health-data = { workspace = true }
health-ledger = { workspace = true }
