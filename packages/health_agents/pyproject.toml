[project]
name = "health-agents"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["health-core", "health-data", "google-adk==2.12.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_agents"]

[tool.uv.sources]
health-core = { workspace = true }
health-data = { workspace = true }
