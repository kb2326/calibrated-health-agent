[project]
name = "health-web"
version = "0.1.0"
description = "Web front end for the Calibrated Health Agent: the ADK workflow over AG-UI"
requires-python = ">=3.13"
dependencies = ["health-core", "health-data", "health-ledger", "health-agents",
                "fastapi>=0.115.2", "uvicorn>=0.35.0", "ag-ui-adk==0.11.0", "typer>=0.12"]

[project.optional-dependencies]
demo = ["health-eval"]

[project.scripts]
cha-web = "health_web.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_web"]

[tool.uv.sources]
health-core = { workspace = true }
health-data = { workspace = true }
health-ledger = { workspace = true }
health-agents = { workspace = true }
health-eval = { workspace = true }
