[project]
name = "health-eval"
version = "0.1.0"
description = "Evals, red team and tracing for the Calibrated Health Agent"
requires-python = ">=3.13"
dependencies = ["health-core", "health-data", "health-ledger", "health-agents", "PyYAML>=6.0", "numpy>=1.26", "typer>=0.12", "google-adk[eval]==2.12.0"]

[project.scripts]
cha-eval = "health_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_eval"]

[tool.uv.sources]
health-core = { workspace = true }
health-data = { workspace = true }
health-ledger = { workspace = true }
health-agents = { workspace = true }
