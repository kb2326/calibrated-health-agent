[project]
name = "health-ledger"
version = "0.1.0"
description = "Honest statistics and the forecast ledger"
requires-python = ">=3.13"
dependencies = [
    "google-cloud-bigquery>=3.27",
    "health-core",
    "health-data",
    "numpy>=1.26",
    "pandas>=2.2",
    "typer>=0.12",
]

[project.scripts]
cha-ledger = "health_ledger.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_ledger"]

[tool.uv.sources]
health-core = { workspace = true }
health-data = { workspace = true }
