# The web front end: lint, types and unit tests (Phase 5). The end-to-end job (a demo-mode
# server with a scripted fake model, Playwright and axe) is added in Task 10. No model calls,
# no secrets, synthetic data only.
name: web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/health_web/**"
      - "packages/health_agents/**"
      - "packages/health_core/**"
      - "uv.lock"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # The real FastAPI app in demo mode (synthetic fixture) with a scripted model: no network
    # calls to any model, no secrets. Chat flow and scoreboard at desktop and phone sizes, in
    # dark and light, with axe (no serious or critical violations) and no CSP errors.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --all-packages --frozen
      - working-directory: apps/web
        run: npm ci --no-audit --no-fund && npm run build
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - working-directory: apps/web
        run: npx playwright test
        env:
          CHA_DATA_MODE: synthetic
